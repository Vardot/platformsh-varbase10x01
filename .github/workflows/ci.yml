# Checks the project template's Composer manifest and its Node.js tooling:
# Node.js 24 and Yarn 4.18.1 (packageManager), with no lockfile committed.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  tooling:
    name: Composer manifest and Node.js tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate composer.json and composer.lock
        run: composer validate --no-check-publish

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install with Yarn 4.18.1
        env:
          # No yarn.lock is committed, so Yarn 4 must be allowed to create one.
          YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
          # postinstall syncs front-end libraries from the Composer-built
          # docroot, which this job does not build.
          YARN_ENABLE_SCRIPTS: "false"
        run: |
          corepack enable
          yarn --version
          yarn install
